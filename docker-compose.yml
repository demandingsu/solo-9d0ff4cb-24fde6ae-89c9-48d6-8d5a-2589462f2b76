services:
  water-quality:
    build: .
    image: water-quality-correction:latest
    container_name: water-quality-correction
    ports:
      - "8000:8000"
    environment:
      WQ_DATA_DIR: /data
      WQ_DB_PATH: /data/water_quality.sqlite3
      WQ_EXPORT_ROOT: /data/exports
    volumes:
      - wq-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  wq-data:
